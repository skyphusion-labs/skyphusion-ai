name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: plugin checks
        run: php tests/endpoint-test.php
      # Shipped PHP only, against tests/phpcs-baseline.txt. A higher count or a
      # new file+sniff pair fails. The baseline is large because the tree does
      # not follow the standard's whitespace rules; that file says what it costs.
      - name: WordPress coding standards
        run: bash tests/phpcs.sh
      # The WordPress.org deploy script, run against a local svn repository. Same
      # pinned gitleaks binary as .github/workflows/wporg-deploy.yml: keep the
      # version and the sha256 in step with it.
      - name: install svn and gitleaks for the deploy test
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: WordPress.org deploy script test
        run: bash tests/wporg-deploy-test.sh

  # NOT a second copy of `ci`. It used to run exactly `php tests/endpoint-test.php`,
  # the same command as the job above, which can only fail when `ci` has already
  # failed for the same reason: a required context that adds no information and
  # costs a full run (issue #3).
  #
  # IT IS REPLACED RATHER THAN DELETED, and that is a deliberate call. `coverage`
  # is a REQUIRED status check on `main` with a strict policy, so a deleted job
  # never reports and every pull request blocks permanently rather than failing.
  # Dropping the required context is a protection-rules change and not this
  # file's to make, so the job stays and earns its place.
  #
  # What it earns is `php -l`, not a coverage percentage. A percentage was not
  # added: the risk this issue names is a parse error, and a percentage does
  # not catch one in a file the suite never loads.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # ENUMERATED FROM git ls-files, never a glob. `host/*.php` in ggc#11
      # returned 7 of 8 files and the job went green on the eighth, which is
      # the failure a glob makes and a listing cannot: a file the pattern
      # misses is indistinguishable from a file that passed.
      #
      # THE FLOOR IS THE PART THAT MAKES THIS A GATE. An empty or truncated
      # listing must FAIL, not pass quietly over nothing. The first draft of
      # this step relied on `--no-run-if-empty` for that and the comment
      # claimed it, which was wrong and was caught by testing the claim:
      # `printf '' | xargs -0 --no-run-if-empty -n1 php -l` exits 0, so an
      # empty list reported SUCCESS. That flag only stops php being invoked
      # with no argument; it says nothing about the exit status. 15 is well
      # under the 20 tracked PHP files, so the floor catches a broken listing
      # without tripping on an ordinary deletion.
      #
      # `xargs -0 -n1` so one bad file fails the step rather than being
      # averaged away, and -0 with `ls-files -z` so a path with a space or a
      # newline cannot split into two names.
      - name: php -l over every tracked PHP file
        run: |
          n=$(git ls-files '*.php' | wc -l)
          if [ "$n" -lt 15 ]; then
            echo "only $n tracked PHP file(s); the listing is wrong, not the tree" >&2
            exit 1
          fi
          git ls-files -z '*.php' | xargs -0 -n1 php -l
          echo "linted $n tracked PHP file(s)"
